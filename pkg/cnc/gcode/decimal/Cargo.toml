[package]
name = "gcode_decimal"
version = "0.1.0"
edition = "2018"

[lib]
doctest = false

[dependencies]
macros = { path = "../../../macros" }
math = { path = "../../../math", default-features = false }
common = { path = "../../../common", default-features = false }
base_error = { path = "../../../base/error", default-features = false }
base_radix = { path = "../../../base/radix", default-features = false }
regexp_macros = { path = "../../../automata/regexp_macros" }
automata = { path = "../../../automata" }

[features]
default = ["std", "alloc"]
alloc = ["base_error/alloc", "math/alloc", "common/alloc", "base_radix/alloc"]
std = ["base_error/std", "math/std", "common/std", "base_radix/std"]