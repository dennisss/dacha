syntax = "proto3";

package cnc;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// TODO: Rename to a 'Program' (but there will be many different types of programs. Some normal and )
message FileProto {
    fixed64 id = 1;

    string name = 2;
    
    uint64 size = 3;

    enum State {
        UNKNOWN = 0;
        UPLOADING = 1;
        PROCESSING = 2;
        READY = 3;
    }
    State state = 4;

    // How much of the current state's work is done (from 0 to 1).
    float state_progress = 5;

    // Time the file was uploaded. Measured as the time when the final byte was written to disk.
    google.protobuf.Timestamp upload_time = 6;

    // TODO: Implement me.
    google.protobuf.Timestamp last_used_time = 7;

    // TODO: Stats on previous attempts to use this file.

    // If present, then this is an playable GCode file.
    ProgramSummaryProto program = 8;

    bool has_thumbnail = 9;

    // Set on demand when looking up files via an RPC call.
    FileUrls urls = 10;

    // When set in the READY state, this implies that the last attempt to process the file was
    // unsuccessful.
    string processing_error = 11;
}

message FileUrls {
    string raw_url = 1;
    string thumbnail_url = 2; 
}

message ProgramSummaryProto {
    uint32 num_lines = 1;

    uint32 num_invalid_lines = 2;

    google.protobuf.Duration normal_duration = 3;

    google.protobuf.Duration silent_duration = 4;

    // TODO: Populate this.
    repeated ProgramToolSummary tools = 12;

    // TODO: Populate this.
    optional float max_bed_temperature = 6;

    repeated string unique_commands = 8;

    // Up to the first 5 errors seen while parsing the file.
    repeated string first_failures = 9;

    // Bounding boxes 
    repeated ProgramCoordinateSystemBounds bounds = 13;

    repeated ProgramObjectSummary objects = 14;

    reserved 5, 10, 11;
}

message ProgramCoordinateSystemBounds {
    // An empty value implies the default coordinate system.
    // Else, this contains the gcode id for the coordinate system. e.g. 'G54'
    string coordinate_system = 1;

    Vector3fProto min_position = 2;

    Vector3fProto max_position = 3;
}

message ProgramObjectSummary {
    // Always present.
    uint32 index = 1;

    string name = 2;

    // 2D Bounding shape for this object. 
    repeated Vector2fProto polygon = 3;

    Vector3fProto min_position = 4;

    Vector3fProto max_position = 5;

    // uint32 total_lines = 4;
}

message Vector2fProto {
    float x = 1;
    float y = 2;
}

message Vector3fProto {
    float x = 1;
    float y = 2;
    float z = 3;
}


message ProgramToolSummary {
    uint32 tool_index = 1;

    optional float max_extruder_temperature = 2;
}
