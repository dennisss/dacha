[package]
name = "cnc_controller_proto"
version = "0.0.0"
edition = "2018"

[lib]
path = "lib.rs"

[dependencies]
common = { path = "../../../common" }
protobuf = { path = "../../../protobuf" }
rpc = { path = "../../../rpc" }
macros = { path = "../../../macros" }
media_camera_proto = { path = "../../../media/camera/proto" }
protobuf_builtins = { path = "../../../../third_party/protobuf_builtins" }
peripherals_proto = { path = "../../../peripherals/proto" }

[build-dependencies]
protobuf_compiler = { path = "../../../protobuf/compiler" }

[features]
default = ["std"]
std = ["alloc", "common/std", "protobuf/std"]
alloc = ["common/alloc", "protobuf/alloc"]
