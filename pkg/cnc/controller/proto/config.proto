syntax = "proto3";

package cnc;

import "pkg/peripherals/proto/service.proto";
import "pkg/cnc/motion/proto/config.proto";
import "pkg/cnc/motion/proto/grid.proto";


message ControllerConfig {
    string name = 1;

    message DeviceEntry {
        string name = 1;

        peripherals.BoardConfig peripheral_config = 2;

        BedClientConfig bed_client = 3;

        peripherals.TMC2209Config tmc2209 = 4;
    }

    repeated DeviceEntry devices = 2;

    MotionControllerConfig motion_controller = 3;

    repeated HeaterControllerConfig heater_controllers = 5;

    EndstopControllerConfig endstop_controller = 6;

    // For now this should always have 4 numbers.
    repeated float bed_fem_weights = 4;

    // Names of all endstops that should be normally monitored
    // (when motors are energized but not homing).
    repeated string default_endstops = 7;

    repeated EndstopSet endstop_sets = 8;

    ZProbeConfig z_probe = 9;

    repeated FanConfig fans = 10;

    repeated ServoConfig servos = 11;

    TimeControllerConfig time = 12;

    repeated DataLoggerConfig loggers = 13;
}

message TimeControllerConfig {

    // Name of the device to use as the 'primary clock'.
    // - This clock is what is logged in event logs.
    // - Conversions from the host's time to all device times is done by first converting
    //   the time to this device's clock and then converting to all other clocks.
    //
    // But note that currently time conversions between different remote devices is always
    // done in one shot since with trust_usb_sof_timing, there is no quality benefit in
    // going between multiple devices in this case.
    string primary_device_name = 1;

    // If true, all remote devices are connected to the same USB 2.0 hub so we can trust that
    // they are all receiving corresponding USB SOF packets at the same time. 
    bool trust_usb_sof_timing = 2;

}

message FanConfig {
    // NOTE: Index '1' is the primary set of part cooling fans.
    // All fans with the same index are controlled together. 
    uint32 group_index = 1;

    string name = 2;

    PeripheralReference speed_control = 3;

    // TODO: Add tachometer.
}

message ServoConfig {
    string name = 1;

    PeripheralReference pwm = 2;
}


message EndstopSet {
    // When any of these axes is moving intentionally towards endstops,
    // we will use this endstop set.
    repeated string axis = 1;

    bool max_limit = 2;

    bool min_limit = 3;

    repeated string monitored_endstops = 4;

    repeated string expected_endstops = 5;
}

message HeaterControllerConfig {

    PeripheralReference thermistor = 1;

    PeripheralReference heater = 2;


}

message PeripheralReference {
    string device_name = 1;
    string peripheral_name = 2;
}

message BedClientConfig {
    float bed_temp_resistor = 1;
    float sheet_temp_resistor = 2;
    float aux_temp_resistor = 3;

    float calibration_a = 4;
    float calibration_b = 5;
    float chip_temp_calibration = 6;

    PeripheralReference serial_peripheral = 7;
}


message MotionControllerConfig {
    message Motor {
        string device_name = 1;
        bool inverted = 2;
        double steps_per_mm = 3;
    }

    repeated Motor motors = 1;

    repeated AxisGeometry geometry = 2;

    repeated Axis axes = 3;

    LinearMotionPlannerConfig planner = 6;
}

message Axis {
    // (also used as the default acceleration)
    double max_acceleration = 1;

    // (also used as the default speed)
    double max_speed = 2;

    string name = 3;

    // Determines how the feed rate is interprated.
    // - The axe with the lowest priority that is moving determined the overall coordination_priority.
    // - Only axes at that coordination_priority follow
    //   the feedrate. Other axes are driven at whatever
    //   speed is needed to coordinate them with the main
    //   axes.
    uint32 coordination_priority = 4;
}

message EndstopControllerConfig {
    repeated Endstop endstops = 1;
}

message Endstop {
    string name = 1;

    PeripheralReference peripheral = 2;

    // When this endstop is triggered, this list of motors will be immediately stopped.
    repeated string motors = 3;

    // If true, then when this endstop is hit, it means that the associated motors will
    // lose their step position when this endstop is hit.
    bool hard = 4;

    // If present, then this is a list of buffers
    // to use for scanning an analog endstop.
    repeated string analog_buffers = 5;
}

message AxisGeometry {
    message Direct {
        string motor_name = 1;
        uint32 motor_index = 2;

        uint32 axis_index = 3;
    }

    message CoreXY {
        uint32 x_axis_index = 1;

        uint32 y_axis_index = 2;
        
        string a_motor_name = 3;
        uint32 a_motor_index = 4;

        string b_motor_name = 5;
        uint32 b_motor_index = 6;
    }

    oneof geometry {
        Direct direct = 1;
        CoreXY core_xy = 2;
    }
}

message ZProbeConfig {
    double travel_feed_rate_xy = 1;
    
    double travel_feed_rate_z = 2;
    
    double probe_feed_rate = 3;
    
    double travel_position_z = 4;
    
    double probe_position_z = 5;

    // After homing, if the Z position of the bed is probed to
    // be > this distance from the origin (Z=0), then we will
    // reject the point as noise and  
    double max_origin_deviation = 6;

    // Maximum number of times we will attempt to probe a single (x,y) point.
    uint32 max_probe_attempts = 7;
}

message ZGridFadeLevelerConfig {


}

// Serialized version of the ZGridFadeLeveler that can be saved/restored to re-use
// previous leveling data.
message ZGridFadeLevelerProto {
    GridValuesProto z_values = 1;

    // TODO: Also include config data.
}


message DataLoggerConfig {
    string name = 1;

    message MA732LoggerConfig {
        PeripheralReference spi_peripheral = 1;
        
        repeated string buffers = 2;
    }

    MA732LoggerConfig ma732 = 2;

}

