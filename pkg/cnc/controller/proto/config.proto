syntax = "proto3";

package cnc;

import "pkg/peripherals/proto/service.proto";
import "pkg/cnc/motion/proto/config.proto";


message ControllerConfig {
    string name = 1;

    message DeviceEntry {
        string name = 1;

        peripherals.BoardConfig peripheral_config = 2;

        BedClientConfig bed_client = 3;

        peripherals.TMC2209Config tmc2209 = 4;
    }

    repeated DeviceEntry devices = 2;

    MotionControllerConfig motion_controller = 3;

    // For now this should always have 4 numbers.
    repeated float bed_fem_weights = 4;
}

message BedClientConfig {
    float bed_temp_resistor = 1;
    float sheet_temp_resistor = 2;
    float aux_temp_resistor = 3;

    float calibration_a = 4;
    float calibration_b = 5;
    float chip_temp_calibration = 6;
}


message MotionControllerConfig {
    message Motor {
        string device_name = 1;
        bool inverted = 2;
        float steps_per_mm = 3;
    }

    repeated Motor motors = 1;

    repeated AxisGeometry geometry = 2;

    repeated Endstop endstops = 7;

    float max_acceleration_xy = 3;
    float max_acceleration_z = 4;
    float maz_acceleration_e = 5;

    LinearMotionPlannerConfig planner = 6;
}

message Endstop {
    string device_name = 1;

    string peripheral_name = 2;

    // When this endstop is triggered, this list of motors will be immediately stopped.
    repeated string motors = 3;

    repeated uint32 motor_indexes = 4; // internal only
}

message AxisGeometry {
    message Direct {
        string motor_name = 1;
        uint32 motor_index = 2;

        uint32 axis_index = 3;
    }

    message CoreXY {
        uint32 x_axis_index = 1;

        uint32 y_axis_index = 2;
        
        string a_motor_name = 3;
        uint32 a_motor_index = 4;

        string b_motor_name = 5;
        uint32 b_motor_index = 6;
    }

    oneof geometry {
        Direct direct = 1;
        CoreXY core_xy = 2;
    }
}


