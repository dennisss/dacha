syntax = "proto3";

package cnc;

import "pkg/peripherals/proto/service.proto";
import "pkg/cnc/motion/proto/config.proto";
import "pkg/cnc/controller/proto/log.proto";
import "pkg/cnc/controller/proto/matrix.proto";


service Controller {
    rpc Execute (ExecuteRequest) returns (ExecuteResponse);

    rpc GetPosition (GetPositionRequest) returns (GetPositionResponse);

    rpc ReadLog (ReadLogRequest) returns (stream ReadLogResponse);
}

message ExecuteRequest {
    repeated Command commands = 1;
}

message ExecuteResponse {

    VectorProto last_position = 1;

    VectorProto hit_position = 2;

}

message Command {
    oneof command {
        MoveToCommand move_to = 1;
        HomeCommand home = 2;
        SetTemperatureCommand set_temp = 3;
        SetPosition set_position = 4;
        ConfigureCommand configure = 5;
        bool reset_alarm = 6;
        bool wait_until_idle = 7;
        SetFanSpeed set_fan_speed = 8;
        SetServoPosition set_servo_position = 9;
    }
}

message SetFanSpeed {
    float speed = 1;

    string name = 2;
}

message SetServoPosition {
    // Position in microseconds.
    float position = 1;
}

message MoveToCommand {
    double x = 1;
    double y = 2;
    double z = 3;
    double e = 4;

    // Alternative way to specify the next position
    VectorProto position = 8;

    bool towards_endstop = 7;

    MoveOptionsProto options = 9;

    reserved 5, 6;
}

message MoveOptionsProto {
    double feed_rate = 1;
    optional double acceleration = 2;
    bool force = 3;
}

message HomeCommand {
    bool skip_z = 1;
}

message SetTemperatureCommand {
    float target = 1;
}

message SetPosition {
    VectorProto position = 1;
}

message ConfigureCommand {
    double max_junction_deviation = 1;
}

message GetPositionRequest {

}

message GetPositionResponse {
    VectorProto position = 1;
}

message SkewData {
    message Point {
        uint32 fixed_group = 1;

        VectorProto machine_position = 2;

        uint32 image_index = 3;

        fixed64 time_micros = 4;

    }

    repeated Point points = 1;
}



message ReadLogRequest {
    
}

message ReadLogResponse {
    LogEntry entry = 1;

}
