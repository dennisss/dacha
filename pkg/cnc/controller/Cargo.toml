[package]
name = "cnc_controller"
version = "0.1.0"
edition = "2018"

[lib]
doctest = false

[dependencies]
macros = { path = "../../macros" }
protobuf = { path = "../../protobuf", default-features = false }
math = { path = "../../math", default-features = false }
math_compute = { path = "../../math/compute" }
common = { path = "../../common", default-features = false }
peripherals = { path = "../../peripherals" }
parsing = { path = "../../parsing" }
file = { path = "../../file" }
crypto = { path = "../../crypto" }
executor = { path = "../../executor" }
executor_multitask = { path = "../../executor/multitask" }
usb = { path = "../../usb" }
nordic_tools = { path = "../../nordic/tools" }
peripherals_service = { path = "../../peripherals/service" }
peripherals_proto = { path = "../../peripherals/proto" }
cnc_controller_proto = { path = "./proto" }
electronics = { path = "../../peripherals/electronics" }
cluster_client = { path = "../../container/client" }
container_proto = { path = "../../container/proto" }
rpc = { path = "../../rpc" }
rpc_util = { path = "../../rpc/util" }
color = { path = "../../image/color" }
scpi = { path = "../../peripherals/scpi" }
cnc = { path = ".." }

[features]
default = ["std", "alloc"]
alloc = ["common/alloc", "math/alloc", "protobuf/alloc"]
std = ["common/std", "math/std", "protobuf/std"]