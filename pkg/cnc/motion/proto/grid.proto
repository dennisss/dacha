syntax = "proto3";

package cnc;

message GridProto {
    double base_point_x = 1;
    double base_point_y = 2;
    double x_interval = 3;
    double y_interval = 4;
    uint32 x_count = 5;
    uint32 y_count = 6;
}

message GridValuesProto {
    GridProto grid = 1;
    repeated double values = 2;
}