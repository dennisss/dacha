syntax = "proto3";

package cluster;

import "pkg/cluster/proto/certificates.proto";
import "google/protobuf/any.proto";

message ZoneConfigBackupFile {
    // Wrapped in an Any proto to ensure there is validation of the data type of the parsed proto.
    google.protobuf.Any data = 1;
}

message ZoneConfigBackup {
    string zone_name = 1;

    repeated bytes tls_registry = 2;

    CertificateSecrets root_credentials = 3;

    string meta_seeds = 4;
}
