<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Video</title>
    <style>
        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #2a2a2a;
        }

        canvas {
            background: #f0f0f0;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <canvas id="frame-canvas" width="960" height="540"></canvas>

    <!-- TODO: Make this work with local files. -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-svg.js"></script>

    <script type="module">
        import { configure } from "./js/timelines/mocap/animation.js";
        // import { configure } from "./js/timelines/button/animation.js";
        // import { configure } from "./js/timelines/3d_printer/toolhead_animation.js";
        // import { configure } from "./js/timelines/3d_printer/motion_animation.js";
        // import { configure } from "./js/timelines/3d_printer/alignment_animation.js";
        // import { configure } from "./js/timelines/jbod/jbod_animation.js"
        // import { configure } from "./js/timelines/3d_printer/magnets_animation.js"

        async function main() {
            // TODO: Also add the noto emoji font.

            const noto_font = new FontFace('Noto Sans', 'url("/third_party/noto_sans/font_normal.ttf")');
            document.fonts.add(noto_font);

            const mono_font = new FontFace('Noto Sans Mono', 'url("/third_party/noto_sans/font_mono_normal.ttf")');
            document.fonts.add(mono_font);

            await noto_font.load();
            await mono_font.load();

            let canvas = document.getElementById('frame-canvas');

            let vid = await configure(canvas);

            const ctx = canvas.getContext('2d');

            vid.start(canvas, ctx);
        }

        main();
    </script>
</body>

</html>
