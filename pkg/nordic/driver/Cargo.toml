[package]
name = "nordic_driver"
version = "0.1.0"
edition = "2018"

[dependencies]
common = { path = "../../common" }
protobuf = { path = "../../protobuf" }
macros = { path = "../../macros" }
usb = { path = "../../usb" }
crypto = { path = "../../crypto" }
cluster_client = { path = "../../cluster/client" }
nordic_proto = { path = "../proto" }
nordic_wire = { path = "../wire" }
rpc = { path = "../../rpc" }
http = { path = "../../http" }
rpc_util = { path = "../../rpc/util" }
protobuf_builtins = { path = "../../../third_party/protobuf_builtins" }
executor = { path = "../../executor" }
executor_multitask = { path = "../../executor/multitask" }
peripherals_proto = { path = "../../peripherals/proto" }

[build-dependencies]
protobuf_compiler = { path = "../../protobuf/compiler" }

[features]
default = ["std", "alloc"]
alloc = ["common/alloc", "crypto/alloc", "protobuf/alloc", "usb/alloc", "nordic_proto/alloc", "nordic_wire/alloc", "rpc/alloc", "protobuf_builtins/alloc"]
std = ["common/std", "crypto/std", "protobuf/std", "usb/std", "nordic_proto/std", "nordic_wire/std", "rpc/std", "protobuf_builtins/std"]