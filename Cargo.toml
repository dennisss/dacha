[profile.dev]
#opt-level = 3
#lto = true

# Crypto is expensive. Always optimize it.
[profile.dev.package.crypto]
opt-level = 3
debug = false

[profile.dev.package.executor]
opt-level = 3
debug = true

[profile.dev.package.http]
opt-level = 3
debug = true

[profile.dev.package.rpc]
opt-level = 3
debug = true

# Also very expensive
[profile.dev.package.compression]
opt-level = 3
debug = false

[profile.dev.package.math]
opt-level = 3
debug = false

[profile.dev.package.protobuf_compiler]
opt-level = 3
debug = false

[profile.dev.package.protobuf_core]
opt-level = 3
debug = false

[profile.dev.package.protobuf_descriptor]
opt-level = 3
debug = false

[profile.dev.package.xml]
opt-level = 3
debug = false

[profile.dev.package.image]
opt-level = 3
debug = false

[profile.release]
lto = true
opt-level = 3 
panic = 'abort'
debug = true

[profile.mcu-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

